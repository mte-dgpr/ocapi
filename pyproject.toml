[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ocapi"
version = "0.1.0"
description = "Pipeline de détection, résolution et rendu des arrêtés (OCAPI)."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = []
keywords = ["ocapi", "arretes", "llm", "pipeline"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
]
dependencies = [
  "beautifulsoup4>=4.12",
  "langchain-core>=0.2.0",
  "networkx>=3.2",
  "pydantic>=2.8",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = [
  "autoflake==2.3.1",
  "black==25.1.0",
  "coverage>=7.6.0",
  "flake8==7.2.0",
  "flake8-bugbear>=24.4.0",
  "isort==5.13.2",
  "mypy>=1.13.0",
  "pre-commit>=3.8.0",
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.7.0",
]

[project.urls]
homepage = "https://example.org/ocapi"
repository = "https://example.org/ocapi"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["ocapi"]

[tool.hatch.build.targets.sdist]
exclude = ["data"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["ocapi"]

[tool.autoflake]
remove-all-unused-imports = true
remove-unused-variables = true
ignore-init-module-imports = true

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP"]
ignore = ["E203", "W503"]

[tool.flake8]
max-line-length = 100
extend-select = ["B"]
extend-ignore = ["E203", "W503"]
exclude = ["data", ".venv", "build", "dist"]

[tool.mypy]
python_version = "3.10"
plugins = ["pydantic.mypy"]
mypy_path = ["."]
packages = ["ocapi"]
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_configs = true
exclude = ["data", "build", "dist", ".venv"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["ocapi"]
addopts = "-ra --strict-config --strict-markers --cov=ocapi --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["ocapi"]
omit = ["*/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true
