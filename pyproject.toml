[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ocapi"
version = "0.1.0"
description = "Outil de Consolidation Automatique des Permis ICPE (OCAPI)."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
  {name = "Data Studio Risques", email="datastudiorisques.mnd@developpement-durable.gouv.fr"},
  {name = "Marie TCHENG", email=""},
  {name = "Nicolas PINHAL", email=""},

]
keywords = ["ocapi", "arretes", "llm", "pipeline"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "arretify~=0.2.0",
  "beautifulsoup4>=4.12",
  "langchain-core>=0.2.0",
  "networkx>=3.2",
  "pydantic>=2.8",
  "pydantic-settings>=2.0",
  "requests>=2.31",
  "roman>=4.2",
  "types-requests>=2.31",
]

[project.optional-dependencies]
dev = [
  "autoflake==2.3.1",
  "black==25.1.0",
  "coverage>=7.6.0",
  "flake8==7.2.0",
  "flake8-bugbear>=24.4.0",
  "isort==5.13.2",
  "mypy>=1.13.0",
  "pdoc>=14.0",
  "pre-commit>=3.8.0",
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0",
  "openpyxl>=3.1.0",
]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mkdocs-mermaid2-plugin>=1.1",
  "pymdown-extensions>=10.7",
]

[project.scripts]
# CLI principal OCAPI
ocapi = "ocapi.cli:main"
# Alias local pour flake8 (commande raccourcie "flake" + tolère le préfixe "check")
flake = "ocapi.cli_flake:main"

[project.urls]
homepage = "https://mte-dgpr.github.io/ocapi/"
repository = "https://github.com/mte-dgpr/ocapi"
documentation = "https://mte-dgpr.github.io/ocapi/"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["ocapi"]

[tool.hatch.build.targets.sdist]
exclude = ["data"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["ocapi"]

[tool.autoflake]
remove-all-unused-imports = true
remove-unused-variables = true
ignore-init-module-imports = true

[tool.flake8]
exclude = [
  ".git",
  "__pycache__",
  "venv",
  ".venv",
  "build",
  "dist",
  "data",
]
max-line-length = 100
# Compatibilité Black : ignore E203
# Compatibilité Black/Bugbear : ignore E701 (statements multiples)
extend-ignore = ["E203", "E701"]
# isort via flake8-isort
extend-select = ["I", "B"]
# Imports autorisés non utilisés dans les __init__
per-file-ignores = {"__init__.py" = ["F401"]}

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
packages = ["ocapi"]
strict = true
warn_unreachable = true
warn_unused_configs = true
show_error_codes = true
follow_untyped_imports = true
exclude = [
  "data",
  "build",
  "dist",
  ".venv",
]

[tool.pytest.ini_options]
minversion = "8.3"
pythonpath = ["."]
testpaths = ["ocapi"]
python_files = ["*_test.py"]
addopts = "-ra --strict-config --strict-markers --cov --cov-report=term-missing --cov-fail-under=80"
markers = ["snapshot: non-regression snapshot tests (run with pytest -m snapshot)"]

[tool.coverage.run]
branch = true
source = ["ocapi"]
omit = ["*/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true
