<!DOCTYPE html>
<html>
 <head>
  <meta charset="utf-8"/>
  <link href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.13.0/dist/dsfr.css" rel="stylesheet"/>
  <style>
   :root {
                --spacing-1: 1rem;
                --spacing-0p5: 0.5rem;
                --spacing-2: 2rem;

                --page-separator-footer-height: 2em;
                --page-separator-line-height: 0.5em;
                --page-separator-header-height: 2em;
                --page-separator-total-height: calc(var(--page-separator-footer-height) + var(--page-separator-line-height) + var(--page-separator-header-height));
            }

            header, main, footer {
                max-width: 800px;
                margin: auto;
                padding: var(--spacing-1);
            }

            ul, ol {
                list-style: none;
            }

            blockquote {
                border-left: 1px solid var(--border-plain-grey);
                padding-left: var(--spacing-1);
            }

            table {
                border-collapse: collapse;
                width: 100%;
            }

            th {
                text-align: left;
            }

            td, th {
                border: solid 1px #cecece;
                padding: 0.5rem;
            }

            a[data-spec="document_reference"], a[data-spec="section_reference"] {
                color: var(--text-action-high-blue-france);
            }

            *[data-error_codes] {
                font-family: monospace;
                background-color: #ffd0d0 !important;
            }

            [data-spec="alinea"]::before, [data-spec="visa"]::before, [data-spec="motifs"]::before {
                color: var(--text-disabled-grey);
                position: absolute;
                top: 0;
                left: -1rem;
            }

            address {
                display: inline;
            }

            /**************** HEADER ****************/
            header {
                padding-bottom: 0;
                margin-bottom: 0;
            }

            [data-spec="emblem"], [data-spec="entity"], [data-spec="identification"], [data-spec="arrete_title"], [data-spec="honorary"] {
                padding: var(--spacing-1);
                background-color: var(--background-alt-grey);
                text-align: center;
            }

            [data-spec="arrete_title"] {
                color: var(--text-title-grey);
                margin-top: var(--spacing-2);
            }

            [data-spec="arrete_title"] h1 {
                margin: 0;
            }

            [data-spec="emblem"], [data-spec="entity"], [data-spec="identification"], [data-spec="honorary"] {
                color: var(--text-title-blue-france);
                font-size: 120%;
            }

            [data-spec="visa"], [data-spec="motifs"], [data-spec="supplementary_motif_info"], [data-spec="table_of_contents"] {
                position: relative;
                margin-top: var(--spacing-1);
                padding-bottom: 0;
            }

            [data-spec="visa"]::before, [data-spec="motifs"]::before {
                content: '⮞';
            }

            header > *:last-child {
                border-bottom: 1px solid var(--background-action-low-blue-france);
                padding-bottom: var(--spacing-1);
            }

            /**************** MAIN CONTENT AND APPENDIX ****************/
            [data-spec="section"] {
                padding: var(--spacing-0p5) 0;
            }

            [data-spec="alinea"] {
                position: relative;
                margin-top: var(--spacing-0p5);
            }

            [data-spec="alinea"]::before {
                content: '¶';
            }

            [data-spec="alinea"] img {
                max-width: 100%;
            }

            [data-spec="operation"] {
                background-color: var(--background-action-low-blue-france);
            }

            /**************** Original page_separator takes up space ****************/
            [data-spec="page_separator"] {
                display: block;
                min-height: var(--page-separator-total-height);
                visibility: hidden;
            }

            /**************** Hide original page_header and page_footer ****************/
            [data-spec="page_header"],
            [data-spec="page_footer"] {
                display: none;
            }

            /**************** Page separator groups ****************/
            .page_separator_group {
                position: absolute;
                left: 0;
                width: 100vw;
                height: var(--page-separator-total-height);
            }

            .page_separator_footer,
            .page_separator_header {
                width: 100%;
                font-size: 75%;
                color: var(--grey-625-425);
                background-color: rgba(255, 255, 255, 0.9);
                padding: 0.25rem 0.5rem;
                box-sizing: border-box;
            }

            .page_separator_footer {
                height: var(--page-separator-footer-height);
                text-align: right;
            }

            .page_separator_header {
                height: var(--page-separator-header-height);
                display: flex;
                justify-content: space-between;
                align-items: center;
            }

            .page_separator_hline {
                width: 100%;
                height: var(--page-separator-line-height);
                background-color: var(--grey-950-100);
            }

            .page_separator_page_number {
                color: var(--grey-625-425);
            }
  </style>
  <script>
   window.onload = function() {
                // Page separators are inline elements, so they can be anywhere in the tree.
                // We create visual page separator containers that include:
                // - Footer from previous page (above, right)
                // - Separator line
                // - Page number (below, left)
                // - Header from next page (below, right)

                const elements = Array.from(document.querySelectorAll('[data-spec="page_footer"], [data-spec="page_separator"], [data-spec="page_header"]'))

                const refreshPageSeparators = () => {
                    // Remove existing page separator groups
                    document.querySelectorAll('.page_separator_group')
                        .forEach(el => el.remove())

                    // Build list of {separator, header, footer} objects
                    const separatorData = []
                    let pendingFooter = null

                    elements.forEach(element => {
                        if (element.dataset.spec === 'page_footer') {
                            pendingFooter = element
                        } else if (element.dataset.spec === 'page_separator') {
                            separatorData.push({
                                separator: element,
                                footer: pendingFooter,
                                header: null
                            })
                            pendingFooter = null
                        } else if (element.dataset.spec === 'page_header') {
                            const lastSeparator = separatorData[separatorData.length - 1]
                            if (lastSeparator) {
                                lastSeparator.header = element
                            }
                            pendingFooter = null
                        }
                    })

                    // Create a group container for each separator trio
                    separatorData.forEach(data => {
                        const pageIndex = parseInt(data.separator.dataset.page_index, 10)
                        const position = getPositionRelativeToDocument(data.separator)

                        // Create page separator group with fixed layout
                        const group = document.createElement('div')
                        group.classList.add('page_separator_group')
                        group.style.top = `${position.top}px`
                        group.innerHTML = `
                            <div class="page_separator_footer">${data.footer ? data.footer.innerHTML : ''}</div>
                            <div class="page_separator_hline"></div>
                            <div class="page_separator_header">
                                <span class="page_separator_page_number">↓ page ${pageIndex + 1}</span>
                                <span>${data.header ? data.header.innerHTML : ''}</span>
                            </div>
                        `

                        document.body.appendChild(group)
                    })
                }

                refreshPageSeparators()
                window.addEventListener('resize', refreshPageSeparators)
            }

            const getPositionRelativeToDocument = (el) => {
                const rect = el.getBoundingClientRect()
                return {
                    left: rect.left + window.scrollX,
                    top: rect.top + window.scrollY,
                }
            }
  </script>
