name: CI

on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

env:
  ENV: development
  LC_ALL: C

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Install mistralai from its GitHub tag because the project is currently
      # quarantined on PyPI (security incident on the 2.4.6 release on 2026-05-12).
      # Drop this once PyPI un-quarantines mistralai.
      - run: pip install "mistralai @ git+https://github.com/mistralai/client-python.git@v1.12.4"
      - run: pip install .[dev]

      - name: Run unit tests
        run: pytest -m "not snapshot" --cov --cov-report=html:htmlcov --cov-report=term-missing --cov-fail-under=80

      - name: Run snapshot tests
        if: github.event_name == 'pull_request'
        timeout-minutes: 5
        run: pytest -m snapshot -v --no-cov

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # See note in unit-tests job; remove once mistralai is back on PyPI.
      - run: pip install "mistralai @ git+https://github.com/mistralai/client-python.git@v1.12.4"
      - run: pip install .[dev]

      - run: mypy
      - run: black . --check
