name: CI

on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

env:
  ENV: development
  LC_ALL: C

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install .[dev]

      - name: Run unit tests
        run: pytest -m "not snapshot" --cov --cov-report=html:htmlcov --cov-report=term-missing --cov-fail-under=80

      - name: Run snapshot tests
        if: github.event_name == 'pull_request'
        timeout-minutes: 5
        run: pytest -m snapshot -v --no-cov

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install .[dev]

      - run: mypy
      - run: black . --check
