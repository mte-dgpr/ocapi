site_name: OCAPI
site_url: https://mte-dgpr.github.io/ocapi/
site_description: Outil de Consolidation Automatique des Permis ICPE
repo_url: https://github.com/mte-dgpr/ocapi
repo_name: mte-dgpr/ocapi
edit_uri: edit/main/docs/

docs_dir: docs

theme:
  name: material
  language: fr
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - toc.follow
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Passer en mode sombre
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Passer en mode clair

plugins:
  - search
  - mermaid2

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom

nav:
  - Accueil: index.md
  - Architecture: architecture.md
  - Installation: installation.md
  - Configuration: configuration.md
  - Usage: usage.md
  - Référence CLI: cli-reference.md
  - Étapes du pipeline:
      - Detection: pipeline-steps/detection.md
      - Resolution: pipeline-steps/resolution.md
      - Rendering: pipeline-steps/rendering.md
  - LLM: llm.md
  - Décisions d'architecture:
      - decision-records/index.md
      - 0001 — Pipeline en trois étapes: decision-records/0001-three-step-pipeline.md
      - 0002 — Détection par LLM: decision-records/0002-llm-for-detection.md
      - 0003 — Snapshot testing: decision-records/0003-snapshot-testing.md
  - API: api/index.md
  - Contribuer: contributing.md
  - Dépannage: troubleshooting.md
  - Glossaire: glossary.md
